[build]
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/.netlify/functions/api/docs/:splat"
  status = 200